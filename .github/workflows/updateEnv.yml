name: Update Environment Variables in GitHub Secrets

on:
  push:
    branches:
      - dev  # Adjust to match the relevant branch

jobs:
  update-secrets:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Install GitHub CLI
      - name: Set up GitHub CLI
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gh
          gh --version

      # Authenticate with GitHub CLI
      - name: Authenticate with GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.G_TOKEN }}
        run: |
          echo "${{ secrets.G_TOKEN }}" | gh auth login --with-token

      # Extract and update environment variables from application.properties
      - name: Update Secrets from application.properties
        env:
          APP_PROPERTIES_PATH: "./src/main/resources/application.properties" # Adjust this path
        run: |
          # Check if application.properties exists
          if [ ! -f "$APP_PROPERTIES_PATH" ]; then
            echo "Error: application.properties file not found at $APP_PROPERTIES_PATH"
            exit 1
          fi

          # Process each line in the properties file
          while IFS='=' read -r key value; do
            # Skip empty lines and comments
            if [[ -n "$key" && -n "$value" && $key != \#* ]]; then
              # Check if the secret already exists
              if gh secret list | grep -q "^$key"; then
                echo "Updating existing secret: $key"
                echo -n "$value" | gh secret set "$key" --visibility all
              else
                echo "Adding new secret: $key"
                echo -n "$value" | gh secret set "$key" --visibility all
              fi
            fi
          done < "$APP_PROPERTIES_PATH"
