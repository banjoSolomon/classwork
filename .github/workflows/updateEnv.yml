name: Update Secrets

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - ".gitignore"

jobs:
  update-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install GitHub CLI
        run: sudo apt-get install gh -y

      - name: Decode application.properties
        env:
          APP_PROPERTIES_B64: ${{ secrets.APPLICATION_PROPERTIES }}
        run: |
          echo "$APP_PROPERTIES_B64" | base64 -d > application.properties

      - name: Update GitHub Secrets
        env:
          GH_TOKEN: ${{ secrets.G_TOKEN }}
        run: |
          # Fetch existing secrets
          existing_secrets=$(gh secret list --visibility all --json name | jq -r '.[].name')

          while IFS= read -r line; do
            [[ -z "$line" || "$line" == \#* ]] && continue
          
            # Extract the key and value
            key=$(echo "$line" | cut -d'=' -f1 | tr '.-' '__')  # Replace invalid characters
            value=$(echo "$line" | cut -d'=' -f2-)
          
            # Validate key format
            if [[ "$key" =~ ^[a-zA-Z_][a-zA-Z0-9_]*$ ]]; then
              if echo "$existing_secrets" | grep -q "^$key$"; then
                echo "Updating existing secret: $key"
              else
                echo "Adding new secret: $key"
              fi
              echo "$value" | gh secret set "$key"
            else
              echo "Skipping invalid key: $key"
            fi
          done < application.properties
