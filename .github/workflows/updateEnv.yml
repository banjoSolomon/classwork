name: Update Secrets

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - ".gitignore"

jobs:
  update-secrets:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Install GitHub CLI
      - name: Install GitHub CLI
        run: sudo apt-get install gh -y

      # Step 3: Decode the application.properties
      - name: Decode application.properties
        env:
          APP_PROPERTIES_B64: ${{ secrets.APPLICATION_PROPERTIES }}
        run: |
          echo "$APP_PROPERTIES_B64" | base64 -d > application.properties
          echo "Decoded application.properties:"
          cat application.properties

      # Step 4: Re-encode application.properties (if updated)
      - name: Re-encode application.properties (if updated)
        run: |
          base64 application.properties > encoded.properties
          echo "Re-encoded application.properties to check for updates"
          cat encoded.properties

      # Step 5: Compare the newly encoded application.properties with the previous one
      - name: Compare encoded properties and update if new
        id: compare
        run: |
          if [[ -f "encoded.properties" && -f "previous_encoded.properties" ]]; then
            if diff encoded.properties previous_encoded.properties > /dev/null; then
              echo "No changes detected, skipping update."
              echo "no_changes=true" >> $GITHUB_ENV
            else
              echo "Changes detected, updating secrets."
              echo "changes_detected=true" >> $GITHUB_ENV
            fi
          else
            echo "First run or missing previous encoded properties. Proceeding with update."
            echo "changes_detected=true" >> $GITHUB_ENV
          fi

      # Step 6: Update GitHub Secrets only if changes were detected
      - name: Update GitHub Secrets
        if: env.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.G_TOKEN }}
        run: |
          # Fetch existing secrets
          existing_secrets=$(gh secret list --visibility all --json name | jq -r '.[].name')
          echo "Existing secrets: $existing_secrets"

          # Loop through the application.properties file
          while IFS= read -r line; do
            # Skip empty lines or comments
            [[ -z "$line" || "$line" == \#* ]] && continue

            # Validate key=value format
            if [[ "$line" =~ = ]]; then
              # Extract the key and value
              key=$(echo "$line" | cut -d'=' -f1 | tr '.-' '__' | xargs)  # Replace invalid characters and trim spaces
              value=$(echo "$line" | cut -d'=' -f2- | xargs)             # Trim spaces

              # Check if the key format is valid
              if [[ "$key" =~ ^[a-zA-Z_][a-zA-Z0-9_]*$ ]]; then
                # Check if the secret already exists
                if echo "$existing_secrets" | grep -q "^$key$"; then
                  echo "Updating existing secret: $key"
                else
                  echo "Adding new secret: $key"
                fi
                # Add or update the secret
                echo "$value" | gh secret set "$key"
              else
                echo "Skipping invalid key format: $key"
              fi
            else
              echo "Skipping invalid line: $line"
            fi
          done < application.properties

          # Print the final list of updated secrets
          echo "Updated secrets:"
          gh secret list --visibility all --json name | jq -r '.[].name'

      # Debugging Step (Optional): Print application.properties content
      - name: Debug application.properties
        run: |
          echo "Decoded application.properties:"
          cat application.properties
