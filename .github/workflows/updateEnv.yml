name: Update Environment Variables in GitHub Secrets

on:
  push:
    branches:
      - dev  # Adjust branch as needed

jobs:
  update-secrets:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # List files to verify the correct path
      - name: List files in the repository
        run: |
          ls -R

      # Install GitHub CLI
      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      # Authenticate with GitHub CLI
      - name: Authenticate with GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.G_TOKEN }}  # Ensure that G_TOKEN secret is available
        run: |
          gh auth status || { echo "Authentication failed"; exit 1; }

      # Check if the application.properties file exists
      - name: Ensure application.properties file exists
        run: |
          if [ ! -f "./classwork/src/main/resources/application.properties" ]; then
            echo "Error: application.properties file not found"
            exit 1
          fi

      # Extract variables from application.properties and update GitHub secrets
      - name: Extract and Update Secrets from application.properties
        run: |
          # Set the path to the application.properties file
          APP_PROPERTIES_PATH="./classwork/src/main/resources/application.properties"

          # Read the application.properties and extract key-value pairs
          while IFS='=' read -r key value; do
            # Skip empty lines or comments
            if [ -n "$key" ] && [ -n "$value" ] && [[ $key != \#* ]]; then
              # Strip leading/trailing whitespace
              key=$(echo "$key" | xargs)
              value=$(echo "$value" | xargs)

              # Update the secret in GitHub (using GitHub CLI)
              echo "Updating secret: $key"
              echo -n "$value" | gh secret set "$key"
            fi
          done < "$APP_PROPERTIES_PATH"
